<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Personality Chatbot</title>

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#95a3b8;
      --accent:#6ee7b7;
      --user:#1e293b;
      --assistant:#0b1220;
      --bubble-user: linear-gradient(180deg,#0b2440,#07203b);
      --bubble-assistant: linear-gradient(180deg,#0b1220,#071826);
      --glass: rgba(255,255,255,0.03);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(20,40,60,0.35), transparent),
                  radial-gradient(800px 400px at 90% 90%, rgba(20,30,50,0.22), transparent),
                  var(--bg);
      color: #e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .app {
      max-width:920px;
      margin:28px auto;
      display:grid;
      grid-template-rows: auto 1fr auto;
      height:calc(100vh - 56px);
      gap:18px;
      padding:18px;
    }

    header.app-header {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo {
      width:48px;
      height:48px;
      border-radius:10px;
      background: linear-gradient(135deg,#09304a,#0b2e45);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:18px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
    }
    h1 { margin:0; font-size:18px; letter-spacing:0.2px; }
    p.subtitle { margin:0; color:var(--muted); font-size:13px; }

    .chat-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .messages {
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:auto;
      flex:1 1 auto;
      scroll-behavior:smooth;
      background-image: linear-gradient(transparent 96%, rgba(255,255,255,0.01));
    }

    .message {
      max-width:78%;
      padding:12px 14px;
      border-radius:12px;
      line-height:1.35;
      box-shadow: 0 4px 14px rgba(2,6,23,0.5);
      word-break:break-word;
    }
    .message.user {
      align-self:flex-end;
      background: var(--bubble-user);
      border: 1px solid rgba(255,255,255,0.03);
      border-bottom-right-radius:4px;
    }
    .message.assistant {
      align-self:flex-start;
      background: var(--bubble-assistant);
      border: 1px solid rgba(255,255,255,0.03);
      border-bottom-left-radius:4px;
    }
    .meta {
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
    }

    .input-area {
      display:flex;
      gap:12px;
      align-items:center;
      padding:12px;
      border-top:1px solid rgba(255,255,255,0.02);
      background: linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
      flex-shrink:0;
    }

    textarea#prompt {
      flex:1 1 auto;
      min-height:42px;
      max-height:160px;
      resize:none;
      background:var(--glass);
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
      color:inherit;
      padding:10px 12px;
      font-size:14px;
      outline:none;
    }

    button.send {
      background: linear-gradient(180deg,var(--accent),#3bd79f);
      color:#04201b;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      box-shadow: 0 6px 18px rgba(12,40,30,0.25);
    }
    button.send[disabled]{
      opacity:0.5;
      cursor:not-allowed;
    }

    .controls {
      display:flex;
      gap:10px;
      align-items:center;
      margin-left:auto;
      color:var(--muted);
      font-size:13px;
    }

    .small-input {
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      padding:6px 8px;
      border-radius:8px;
      color:var(--muted);
      font-size:13px;
      width:90px;
    }

    .typing {
      display:inline-flex;
      gap:6px;
      align-items:center;
      font-size:13px;
      color:var(--muted);
    }

    .dot {
      width:7px;height:7px;border-radius:50%;background:var(--muted);
      opacity:0.6; animation: blink 1.2s infinite;
    }
    .dot:nth-child(2){ animation-delay:0.15s }
    .dot:nth-child(3){ animation-delay:0.30s }
    @keyframes blink { 0%, 80% { opacity:0.15 } 40% { opacity:0.9 } }

    .footer-note{ text-align:center; color:var(--muted); font-size:13px; padding-top:8px; }
    @media (max-width:640px){
      .app { padding:12px; height:calc(100vh - 24px); }
      .logo { width:40px; height:40px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">AI</div>
      <div>
        <h1>AI Personality Chatbot</h1>
        <p class="subtitle">FastAPI + Gemini — local demo (POST /chat)</p>
      </div>
    </header>

    <main class="chat-card" role="main" aria-live="polite">
      <div id="messages" class="messages" aria-live="polite" aria-atomic="false">
      </div>

      <div class="input-area">
        <textarea id="prompt" placeholder="Type your message and press Enter or click Send..." rows="1" aria-label="Message"></textarea>

        <div class="controls" aria-hidden="false">
          <input id="temperature" type="number" class="small-input" placeholder="temp" min="0" max="1" step="0.05" value="0.2" title="Temperature (0-1)" />
          <input id="maxTokens" type="number" class="small-input" placeholder="max tokens" min="16" max="2048" step="1" value="512" title="Max output tokens" />
          <button id="sendBtn" class="send" title="Send message">Send</button>
        </div>
      </div>
    </main>

    <div class="footer-note">
      Running locally? Make sure your backend `main.py` is running and accepts `POST /chat`.
    </div>
  </div>

<script>
(function(){
  const messagesEl = document.getElementById('messages');
  const promptEl = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const tempEl = document.getElementById('temperature');
  const maxTokensEl = document.getElementById('maxTokens');

  const HISTORY_LIMIT = 12; 
  const history = []; 

  function appendMessage(role, text, meta = '') {
    const wrapper = document.createElement('div');
    wrapper.className = 'message ' + (role === 'user' ? 'user' : 'assistant');
    wrapper.textContent = text;
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = meta;
    wrapper.appendChild(metaEl);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendTypingIndicator() {
    const el = document.createElement('div');
    el.className = 'message assistant typing-indicator';
    el.id = 'typing-indicator';
    el.innerHTML = 'Thinking <span class="meta">...</span><div style="height:8px"></div>';
    const dots = document.createElement('div');
    dots.className = 'typing';
    dots.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    el.appendChild(dots);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setControlsDisabled(disabled) {
    sendBtn.disabled = disabled;
    promptEl.disabled = disabled;
    tempEl.disabled = disabled;
    maxTokensEl.disabled = disabled;
  }

  function pushHistory(role, text) {
    history.push({role, text});
    while (history.length > HISTORY_LIMIT) history.shift();
  }

  async function sendMessage(rawMessage) {
    const message = rawMessage.trim();
    if (!message) return;

    appendMessage('user', message, 'You');
    pushHistory('user', message);

    const payload = {
      message: message,
      history: history.slice(),
      temperature: parseFloat(tempEl.value) || 0.2,
      max_output_tokens: parseInt(maxTokensEl.value) || 512
    };

    setControlsDisabled(true);
    appendTypingIndicator();

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      if (!resp.ok) {
        let text;
        try { text = await resp.text(); } catch(e){ text = resp.status + ' ' + resp.statusText; }
        throw new Error('Server error: ' + text);
      }

      const data = await resp.json();
      const assistantText = (data && data.reply) ? data.reply : JSON.stringify(data);
      removeTypingIndicator();
      appendMessage('assistant', assistantText, 'Assistant');
      pushHistory('model', assistantText);

    } catch (err) {
      removeTypingIndicator();
      appendMessage('assistant', 'Error: ' + (err.message || err), 'System');
      console.error('Chat error:', err);
    } finally {
      setControlsDisabled(false);
      promptEl.value = '';
      promptEl.focus();
    }
  }

  sendBtn.addEventListener('click', () => {
    sendMessage(promptEl.value);
  });

  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(promptEl.value);
    }
  });

  const welcome = "Hi! I'm your AI Personality. Ask me anything — or try a prompt like: \"Tell me a short sci-fi opening scene.\"";
  appendMessage('assistant', welcome, 'Assistant');
  pushHistory('model', welcome);

  promptEl.focus();
})();
</script>
</body>
</html>
