<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1>Color Switcher</h1>
    <p>Click any color box to change the background.</p>

    <div class="colors">
      <div class="color-box" data-color="#ff6b6b" style="background:#ff6b6b;"></div>
      <div class="color-box" data-color="#feca57" style="background:#feca57;"></div>
      <div class="color-box" data-color="#1dd1a1" style="background:#1dd1a1;"></div>
      <div class="color-box" data-color="#54a0ff" style="background:#54a0ff;"></div>
      <div class="color-box" data-color="#5f27cd" style="background:#5f27cd;"></div>
      <div class="color-box" data-color="#222f3e" style="background:#222f3e;"></div>
      <div class="color-box" data-color="#ff9ff3" style="background:#ff9ff3;"></div>
      <div class="color-box" data-color="#00d2d3" style="background:#00d2d3;"></div>
    </div>

    <div class="current-color">
      Current color: <span id="currentColorLabel">#f4f4f4 (default)</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
